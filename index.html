<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>来吧,走↑起↓</title>
<style>
  /* ===== 极简黑白 ===== */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;}
  body{
    background:#000;color:#fff;overflow:hidden;user-select:none;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column;padding:10px;gap:8px;}

  /* 顶部状态条 */
  #hud{flex:0 0 auto;display:flex;align-items:center;gap:14px;color:#fff;font-size:14px;}
  #hud .s{font-variant-numeric:tabular-nums;}
  #hud .s b{font-size:18px;}
  #hud .grow{flex:1;}
  #sound{background:none;border:1px solid #555;color:#fff;border-radius:4px;padding:2px 8px;font-size:13px;cursor:pointer;}

  /* 棋盘 */
  #board{flex:1 1 auto;min-height:0;position:relative;}
  #err{margin:0;color:#f55;font-size:12px;word-break:break-all;font-family:monospace;}
  #grid{width:100%;height:100%;display:flex;flex-direction:column;gap:2px;touch-action:manipulation;}
  .row{flex:1 1 0;min-height:0;display:flex;gap:2px;}
  .cell{flex:1 1 0;min-width:0;height:100%;position:relative;}
  .tilewrap{position:absolute;inset:0;overflow:hidden;border-radius:3px;}

  /* 方块：白底 + gqk.png；图片解码失败时只剩白底，照样能玩 */
  .tile{width:100%;height:100%;background:#fff;border-radius:3px;cursor:pointer;overflow:hidden;}
  .tile.img{background:#fff url("gqk.png") center/contain no-repeat;}
  /* 唯一可按的那个：一圈白框提示 */
  .tile.next{outline:3px solid #fff;outline-offset:-3px;}
  /* 已按下：深灰 + gqk1.png，且不再响应 */
  .tile.done{
    background:#262626;pointer-events:none;cursor:default;
    display:flex;align-items:center;justify-content:center;
  }
  .tile.done.img{background:#262626 url("gqk1.png") center/contain no-repeat;}
  .tile.done::after{content:'';width:34%;height:34%;background:#777;border-radius:2px;}

  /* 覆盖层 */
  #start,#over{
    position:absolute;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:#000;text-align:center;
  }
  #start[hidden],#over[hidden]{display:none;}
  #over{background:rgba(0,0,0,.92);}
  h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.2em;}
  p{margin:0;font-size:13px;line-height:1.9;color:#999;}
  .num{font-size:72px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  button.main{
    background:#fff;color:#000;border:0;border-radius:4px;
    padding:14px 44px;font-size:18px;font-weight:700;letter-spacing:.1em;cursor:pointer;
    font-family:inherit;
  }
  button.main:active{background:#bbb;}

  /* ===== 手机端：间距更紧凑 ===== */
  @media (pointer:coarse), (max-width:820px){
    #app{padding:6px;gap:6px;}
    #hud{gap:10px;font-size:13px;}
    #hud .s b{font-size:17px;}
    #grid{gap:1px;}
    .row{gap:1px;}
    .tile.done::after{width:30%;height:30%;}
    .tile.next{outline-width:2px;outline-offset:-2px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="s">剩余 <b id="timer">20.0</b></span>
    <span class="s">按下 <b id="score">0</b></span>
    <span class="s">最高 <b id="best">0</b></span>
    <span class="grow"></span>
    <button id="sound">音效 开</button>
  </div>
  <p id="err"></p>

  <div id="board">
    <div id="grid"></div>

    <div id="start">
      <h1>新概念音游</h1>
      <p>按下第一块开始计时 · 限时 20 秒<br>由下往上依次按 · 只能按最底下那个<br>越级按或按到空白即结束</p>
      <button class="main" id="startBtn">开始游戏</button>
    </div>

    <div id="over" hidden>
      <p>规定时间内按下</p>
      <div class="num" id="finalScore">0</div>
      <p id="finalMsg"></p>
      <button class="main" id="retryBtn">再来一次</button>
    </div>
  </div>
</div>

<script>
/* 错误直接显示在页面上：状态条下方 / 标题栏 */
window.onerror = function (msg, src, line, col) {
  try {
    var e = document.getElementById('err');
    if (e) e.textContent = '脚本错误：' + msg + ' @' + line + ':' + col;
    document.title = 'ERR: ' + msg;
  } catch (_) {}
  return false;
};
</script>
<script>
(function () {
  'use strict';

  /* ======= 参数 ======= */
  var BUILD = 17;        // 构建号：页面上会显示，用来确认浏览器加载的是最新版
  var ROWS = 12;         // 行数
  var COLS = 4;          // 列数：每行 4 个格子
  var DURATION = 20;     // 限时（秒）
  var PRESS_MS = 35;     // 防连点（必须远小于人的最快手速，否则会吞掉有效按键）
  var START_ROWS = 11;   // 开局一次性渲染 11 行
  var HEADROOM = 40;     // 后续按需补算的余量
  var COL_RUN_MAX = 3;   // 同一列最多连续出现几次（每行 1 个，所以就是相邻同列的上限）

  /* ======= 状态（先声明，后面的函数都要用） ======= */
  var state = 'idle';       // idle | playing | over
  var cells = [];           // cells[r][c] = 格子元素
  var live = [];            // live[r] = 该行方块列号（自查用）
  var rows = [];            // rows[n] = [col]，第 n 行（越靠后越靠上）的方块列
  var genRow = 0;           // 已生成的行数
  var cursor = 0;           // 当前该按的行在 rows 里的下标
  var score = 0, endAt = 0, raf = 0, lastPress = 0;
  var best = 0;
  var imgOK = { idle: false, done: false };

  /* ======= 图案：纯随机，每行最多一个方块 ======= */
  // 该列在已有行的末尾连续出现了几行
  function columnRun(col) {
    var n = 0, i, r;
    for (i = rows.length - 1; i >= 0 && n < COL_RUN_MAX; i--) {
      r = rows[i];
      if (!r || r.length === 0 || r[0] !== col) break;   // 每行只有 1 个：不是它就算中断
      n++;
    }
    return n;
  }

  function pickCol() {
    var avail = [], c;
    for (c = 0; c < COLS; c++) {
      if (columnRun(c) < COL_RUN_MAX) avail.push(c);     // 连到上限的列这次不再选
    }
    if (!avail.length) for (c = 0; c < COLS; c++) avail.push(c);   // 兜底，绝不空转
    var i = Math.floor(Math.random() * avail.length);
    return avail[Math.max(0, Math.min(avail.length - 1, i))];
  }

  function ensureRows(n) {
    while (rows.length < n) {
      rows.push([pickCol()]);
      genRow++;
    }
  }

  /* ======= DOM ======= */
  var $ = function (id) { return document.getElementById(id); };
  var gridEl = $('grid'), timerEl = $('timer'), scoreEl = $('score'), bestEl = $('best');
  var startEl = $('start'), overEl = $('over'), finalEl = $('finalScore'), msgEl = $('finalMsg');
  var startBtn = $('startBtn'), retryBtn = $('retryBtn'), soundBtn = $('sound');

  /* ======= 音频 ======= */
  /* 音效地址解析策略（针对内网穿透的混合内容问题）：
     1) 同源相对路径 —— 走页面自己的协议，https 页面就是 https，不存在混合内容
     2) 强制 https 绝对地址 —— 有些穿透的 https 端点能正常回源，只是相对路径被升级坏
     3) 强制 http 绝对地址 —— 只有在 http 页面或浏览器放行时才可能可用
     按顺序探测，第一个“真的能拿到音频”的胜出。
     若你把音效放到别处（CDN / 图床 / 对象存储），在网址后加参数即可覆盖：
        index.html?sndbase=https://your.host/dir
     —— 这是当前穿透无法回源音频时最省事的解法 */
  var muted = false;
  var soundPool = [];
  var pageHttps = (location.protocol === 'https:');

  var SOUND_BASE = (function () {
    try {
      var m = /[?&]sndbase=([^&]+)/.exec(location.search);
      if (m) return decodeURIComponent(m[1]).replace(/\/+$/, '') + '/';
    } catch (e) {}
    return '';
  })();

  function candidates(name) {
    var host = location.hostname;
    var port = location.port ? ':' + location.port : '';
    var out = [];
    if (SOUND_BASE) out.push(SOUND_BASE + name);
    out.push(name);                                            // 相对路径（跟页面同协议）
    if (host) {
      out.push(location.protocol + '//' + host + port + '/' + name);   // 显式同协议
      if (pageHttps) {
        out.push('https://' + host + port + '/' + name);                // 强制 https
        out.push('http://' + host + port + '/' + name);                 // 强制 http（兜底）
      }
    }
    var seen = {}, uniq = [], i;
    for (i = 0; i < out.length; i++) if (!seen[out[i]]) { seen[out[i]] = 1; uniq.push(out[i]); }
    return uniq;
  }

  var audioCtx = null;
  var activeNodes = [];
  var buffers = { hit: null, end: null };       // 解码好的 Web Audio 缓冲
  var media = { hit: null, end: null };         // 媒体通道用的 <audio>
  var chosen = { hit: null, end: null };        // 实际选中的地址
  var resolving = false;

  function makeCtx() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { return new AC(); } catch (e) { return null; }
  }

  /* 把一个地址变成可播放：
     同源地址 → fetch 拿字节交给 Web Audio 解码（精确、可即时掐断）
     跨域地址 → 直接走 <audio> 媒体通道。
       注意：绝不能给 <audio> 设 crossOrigin —— 那会强制走 CORS 预检，
       而内网穿透（frp 等）通常不返回 CORS 头，反而把本来能播的音频弄失败。
       <audio> 播放媒体本身是允许跨域的，不需要 CORS */
  function sameOrigin(url) {
    if (/^[a-z]+:\/\//i.test(url)) {
      try {
        return new URL(url).origin === location.origin;
      } catch (e) { return false; }
    }
    return true;                     // 相对路径必然同源
  }

  function adopter(url, key) {
    return new Promise(function (resolve) {
      function viaMedia() {
        var a = document.createElement('audio');
        a.preload = 'auto';                           // 不设 crossOrigin
        a.src = url;
        var done = false;
        function ok() {
          if (done) return; done = true;
          media[key] = a;
          resolve(true);
        }
        function bad() {
          if (done) return; done = true;
          resolve(false);
        }
        a.addEventListener('loadedmetadata', ok);
        a.addEventListener('canplay', ok);
        a.addEventListener('canplaythrough', ok);
        a.addEventListener('error', bad);
        setTimeout(function () { if (!done) { done = true; resolve(false); } }, 7000);
        try {
          a.load();                                   // 有些移动端必须显式 load 才会取元数据
        } catch (e) {
          /* load 抛错不代表不能播，仍等事件 */
        }
      }

      // 跨域或没有 Web Audio：直接用媒体通道
      if (!audioCtx || !sameOrigin(url)) { viaMedia(); return; }

      fetch(url)
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.arrayBuffer();
        })
        .then(function (buf) {
          return new Promise(function (res, rej) {
            var p = audioCtx.decodeAudioData(buf, res, rej);
            if (p && p.then) p.catch(rej);
          });
        })
        .then(function (dec) {
          buffers[key] = dec;
          resolve(true);
        })
        .catch(function () { viaMedia(); });
    });
  }

  /* 依次探测候选地址，第一个成功的即为答案 */
  function resolveSound(key, name) {
    var list = candidates(name);
    var i = 0;
    function next() {
      if (i >= list.length) {
        note('音效不可用｜' + name + ' 的所有候选地址都拿不到音频。' +
             '请在网址后加 ?sndbase=你的音频目录 指向一个 https 可访问的位置', 20000);
        return;
      }
      var url = list[i++];
      adopter(url, key).then(function (ok) {
        if (ok) {
          chosen[key] = url;
          note('音效就绪｜' + name + ' 来自 ' + url +
               (buffers[key] ? '（解码 ' + buffers[key].duration.toFixed(2) + 's）' : '（媒体通道）'), 10000);
        } else {
          next();
        }
      });
    }
    next();
  }

  /* 开始/结束时把所有正在响的音效一起掐掉 */
  function stopAllSound() {
    var i;
    for (i = 0; i < activeNodes.length; i++) {
      try { activeNodes[i].stop(0); } catch (e) {}
      try { activeNodes[i].disconnect(); } catch (e2) {}
    }
    activeNodes.length = 0;
    for (i = 0; i < soundPool.length; i++) {
      try { soundPool[i].pause(); } catch (e3) {}
      try { soundPool[i].currentTime = 0; } catch (e4) {}
    }
    soundPool.length = 0;
    ['hit', 'end'].forEach(function (k) {
      var a = media[k];
      if (a) { try { a.pause(); a.currentTime = 0; } catch (e5) {} }
    });
  }

  /* 在用户手势里解锁音频并开始探测（手机浏览器要求手势内解锁） */
  var prewarmed = false;
  function unlockAudio() {
    if (!audioCtx) audioCtx = makeCtx();
    if (audioCtx && audioCtx.state === 'suspended') {
      try { audioCtx.resume(); } catch (e) {}
    }
    if (!resolving) {
      resolving = true;
      resolveSound('hit', '111.mp3');
      resolveSound('end', '222.mp3');
    }
    if (!prewarmed) {
      prewarmed = true;
      /* 用静音预播一次，让移动端把媒体通道标成“用户已授权” */
      ['hit', 'end'].forEach(function (k) {
        var a = media[k];
        if (!a) return;
        try {
          var v = a.volume;
          a.volume = 0;
          var p = a.play();
          if (p && p.then) {
            p.then(function () {
              try { a.pause(); a.currentTime = 0; a.volume = v; } catch (e) {}
            }).catch(function () { try { a.volume = v; } catch (e2) {} });
          } else {
            a.pause(); a.currentTime = 0; a.volume = v;
          }
        } catch (e3) {}
      });
    }
  }

  /* 开局自检：只报确定的事实。
     如果此时音频还在探测中，自己再等一会儿重报一次，避免显示成“未就绪”误判 */
  function audioSelfCheck() {
    var sup = 'unknown';
    try {
      var t = document.createElement('audio');
      if (t.canPlayType) sup = t.canPlayType('audio/mpeg') || 'no';
    } catch (e) {}

    function report() {
      var parts = ['audio/mpeg=' + sup];
      parts.push('hit=' + (buffers.hit ? 'ok' : (media.hit ? '媒体通道' : '未就绪')));
      parts.push('end=' + (buffers.end ? 'ok' : (media.end ? '媒体通道' : '未就绪')));
      if (chosen.hit) parts.push('源=' + chosen.hit);
      if (pageHttps) parts.push('页面是 https：音频也必须走 https，否则被混合内容规则拦掉');
      note('音效自检｜' + parts.join('｜'), 12000);
    }

    if (chosen.hit && chosen.end) report();
    else setTimeout(report, 2500);        // 等探测结果出来再报，避免误报
  }

  function play(key) {
    if (muted) return;
    var buf = buffers[key];
    if (buf && audioCtx) {                       // 主通道：Web Audio
      try {
        var src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.onended = function () {
          var k = activeNodes.indexOf(src);
          if (k >= 0) activeNodes.splice(k, 1);
        };
        activeNodes.push(src);
        src.start(0);
        return;
      } catch (e) { /* 落到媒体通道 */ }
    }
    var a = media[key];                          // 备用通道：<audio>
    if (!a) return;
    try {
      var node = a.cloneNode(true);
      soundPool.push(node);
      var p = node.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e2) {}
  }

  soundBtn.addEventListener('click', function () {
    muted = !muted;
    if (muted) stopAllSound();
    soundBtn.textContent = muted ? '音效 关' : '音效 开';
  });

  /* ======= 预加载两张图：能解码才启用图片外观，否则保持纯色兜底 ======= */
  (function preload() {
    function check(url, key, cls) {
      var im = new Image();
      im.onload = function () {
        if (!im.naturalWidth) return;
        imgOK[key] = true;
        var list = document.querySelectorAll('.tile');
        var i;
        for (i = 0; i < list.length; i++) {
          if (list[i].classList.contains('done') === (key === 'done')) list[i].classList.add(cls);
        }
      };
      im.onerror = function () { imgOK[key] = false; };
      im.src = url;
    }
    check('gqk.png', 'idle', 'img');
    check('gqk1.png', 'done', 'img');
  })();

  /* ======= 状态中后段 ======= */
  var noteTimer = 0;
  function note(msg, keepMs) {
    try {
      var e = document.getElementById('err');
      if (!e) return;
      e.textContent = msg;
      if (noteTimer) clearTimeout(noteTimer);
      noteTimer = setTimeout(function () { e.textContent = ''; }, keepMs || 6000);
    } catch (x) {}
  }

  try { best = parseInt(localStorage.getItem('piano.best') || '0', 10) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function buildGrid() {
    gridEl.innerHTML = '';
    cells = [];
    for (var r = 0; r < ROWS; r++) {
      var rowEl = document.createElement('div');
      rowEl.className = 'row';
      var line = [];
      for (var c = 0; c < COLS; c++) {
        var cellEl = document.createElement('div');
        cellEl.className = 'cell';
        cellEl.dataset.row = r;
        cellEl.dataset.col = c;
        var wrap = document.createElement('div');
        wrap.className = 'tilewrap';
        cellEl.appendChild(wrap);
        rowEl.appendChild(cellEl);
        line.push(cellEl);
      }
      gridEl.appendChild(rowEl);
      cells.push(line);
    }
    live = [];
    for (r = 0; r < ROWS; r++) live[r] = [];
  }

  function blankAll() {
    var r, c;
    for (r = 0; r < ROWS; r++) {
      for (c = 0; c < COLS; c++) cells[r][c].firstChild.innerHTML = '';
      live[r] = [];
    }
  }

  /* 重画整页：rows 下标 n 摆到行 (baseRow - (n - cursor))，
     所以 cursor 那一行在最底可按行，越往上下标越大；
     已按过的行（下标 < cursor）留在上方作为记录 */
  function paint() {
    var baseRow = ROWS - 2;          // 最底一行始终留空
    var n, row, col;
    blankAll();
    for (n = cursor; n < rows.length; n++) {
      row = baseRow - (n - cursor);
      if (row < 0) break;            // 已经移出屏幕顶部
      col = Math.max(0, Math.min(COLS - 1, rows[n][0]));
      var t = document.createElement('div');
      var isDone = (n < cursor);
      t.className = 'tile' + (isDone ? ' done' : '') + (imgOK[isDone ? 'done' : 'idle'] ? ' img' : '');
      if (n === cursor) t.classList.add('next');     // 唯一可按的那个
      t.dataset.row = row;
      t.dataset.col = col;
      t.dataset.idx = n;
      cells[row][col].firstChild.appendChild(t);
      live[row].push(col);
    }
  }

  function reset() {
    buildGrid();
    rows = []; genRow = 0; cursor = 0;
    score = 0; lastPress = 0; endAt = 0;
    scoreEl.textContent = '0';
    timerEl.textContent = DURATION.toFixed(1);

    /* 开局一次性算好并渲染 START_ROWS 行（每行最多 1 个） */
    ensureRows(START_ROWS);
    paint();
  }

  function tick() {
    if (state !== 'playing') return;
    var left = (endAt - performance.now()) / 1000;
    if (left <= 0) { timerEl.textContent = '0.0'; gameOver('20 秒时间到'); return; }
    timerEl.textContent = left.toFixed(1);
    raf = requestAnimationFrame(tick);
  }

  function start() {
    unlockAudio();           // 必须在用户手势里解锁音频（手机浏览器要求）
    stopAllSound();          // 每次开始游戏：先把所有音频掐掉
    reset();                 // 重算并重画
    state = 'playing';
    startEl.hidden = true;
    overEl.hidden = true;
    audioSelfCheck();        // 开局自检，把音频状态显示在状态条下方
  }

  function gameOver(why) {
    if (state !== 'playing') return;
    state = 'over';
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    play('end');
    finalEl.textContent = score;
    msgEl.textContent = why;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('piano.best', String(best)); } catch (e) {}
    }
    overEl.hidden = false;
  }

  /* 成功按击：整体往上推进一格，底部按需补算新行 */
  function advance() {
    cursor++;
    ensureRows(cursor + ROWS + HEADROOM);
    paint();
  }

  function press(ev) {
    if (state !== 'playing') return;
    var now = performance.now();
    if (now - lastPress < PRESS_MS) return;

    /* 按坐标几何判定，而不是按事件目标元素判定：
       否则点在方块之间那 1~2px 的缝隙上会被误判成“按到非钢琴块区域” */
    var point = null;
    var t = ev.target;
    try {
      if (ev.clientX !== undefined && ev.clientY !== undefined &&
          (ev.clientX !== 0 || ev.clientY !== 0)) {
        point = { x: ev.clientX, y: ev.clientY };
      } else if (t && t.getBoundingClientRect) {
        var r0 = t.getBoundingClientRect();
        point = { x: r0.left + r0.width / 2, y: r0.top + r0.height / 2 };
      }
    } catch (e0) { point = null; }

    var hit = null;                      // 命中的格子
    if (point) {
      for (var rr = 0; rr < ROWS; rr++) {
        var rect = cells[rr][0].getBoundingClientRect();
        if (point.y < rect.top || point.y > rect.bottom) continue;
        for (var cc = 0; cc < COLS; cc++) {
          var cr = cells[rr][cc].getBoundingClientRect();
          if (point.x >= cr.left && point.x <= cr.right) { hit = { row: rr, col: cc }; break; }
        }
        break;
      }
    }
    /* 坐标法没命中（点到了盘面之外的留白）：退回到元素判定 */
    if (!hit) {
      var tile = (t && t.classList && t.classList.contains('tile')) ? t : null;
      if (!tile) {
        if (!(t && t.dataset && t.dataset.row !== undefined)) return;   // 盘面外留白忽略
        hit = { row: parseInt(t.dataset.row, 10), col: parseInt(t.dataset.col, 10) };
      } else {
        hit = { row: parseInt(tile.dataset.row, 10), col: parseInt(tile.dataset.col, 10) };
      }
    }

    var TARGET = ROWS - 2;               // 可按的那一行（最底行恒为空白）

    /* ① 越级按：点到了可按行以外的任何格子 → 结束 */
    if (hit.row !== TARGET) {
      lastPress = now;
      gameOver('越级按了 · 只能按最底下那一行');
      return;
    }

    /* ② 按到非钢琴块区域 → 结束（每行只有 1 个方块，同一行其余格子都是空的） */
    var wantCol = rows[cursor] ? rows[cursor][0] : -1;
    if (hit.col !== wantCol) {
      lastPress = now;
      gameOver('按到了非钢琴块区域 · 结束');
      return;
    }

    /* ③ 正常按中：从低向高依次推进 */
    var el = cells[TARGET][hit.col].firstChild.firstChild;
    if (!el || el.classList.contains('done')) return;      // 已按过的不响应，也不判负

    lastPress = now;
    if (!endAt) { endAt = now + DURATION * 1000; tick(); }  // 第一块才开始计时
    el.classList.add('done');
    if (imgOK.done) el.classList.add('img');
    score++;
    scoreEl.textContent = score;
    play('hit');
    advance();                       // 每行只有 1 个，按中即整行完成
  }

  /* 输入：pointerdown 优先（低延迟），click 兜底；两者都挂，用时间戳去重 */
  var lastPointer = 0;
  if (window.PointerEvent) {
    gridEl.addEventListener('pointerdown', function (ev) {
      lastPointer = performance.now();
      press(ev);
    }, { passive: true });
  }
  gridEl.addEventListener('click', function (ev) {
    if (performance.now() - lastPointer < 400) return;
    press(ev);
  });
  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);
  document.addEventListener('contextmenu', function (e) {
    if (e.target && e.target.classList && e.target.classList.contains('tile')) e.preventDefault();
  });

  /* 初始画面：只有开始界面，棋盘全空 */
  var bootOk = true;
  try {
    buildGrid();
  } catch (e) {
    bootOk = false;
    var eb = document.getElementById('err');
    if (eb) eb.textContent = '初始化失败：' + e.message;
    document.title = 'ERR: ' + e.message;
  }
  if (bootOk) {
    document.title = '来吧,走↑起↓';
    var badge = document.getElementById('err');
    if (badge) badge.textContent = 'v' + BUILD + ' · 就绪';
    if (pageHttps) {
      setTimeout(function () {
        note('音频提示｜本页是 https，音效只能走 http，可能被浏览器的混合内容规则拦掉：' +
             '请改用穿透的 http 地址访问，或让小皮面板也开 https', 15000);
      }, 1200);
    }
  }
})();
</script>
</body>
</html>
